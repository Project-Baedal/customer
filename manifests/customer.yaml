apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
  labels:
    app: customer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer
  template:
    metadata:
      labels:
        app: customer
    spec:
      containers:
        - name: customer
          image: customer-app
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef:
                name: customer-config

---
apiVersion: v1
kind: Service
metadata:
  name: customer
  labels:
    app: customer
spec:
  type: ClusterIP # 운영 환경: LoadBalancer나 Ingress를 추가로 사용
  selector:
    app: customer # Deployment의 Pod 템플릿 레이블과 일치해야 함.
  ports: # Service가 열어줄 포트 설정 리스트
    - name: http
      port: 80 # 클러스터 내부 서비스가 열어주는 포트, 다른 Pod나 Service가 이 이름(Service 이름)으로 접근할 때 사용.
      targetPort: 8088 # 실제 Pod(컨테이너)에서 수신하는 포트
